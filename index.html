<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка в команду McGroop</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            border: 1px solid #333;
        }
        h2 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #b0b0b0;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Набор в команду McGroop</h2>
        <form action="https://api.web3forms.com/submit" method="POST">
            
            <!-- Секретный ключ Web3Forms -->
            <input type="hidden" name="access_key" value="C3850476-3e1b-4a1a-912d-694d5a4662d5">

            <label for="nickname">Ник в Minecraft:</label>
            <input type="text" id="nickname" name="nickname" required placeholder="Твой никнейм">

            <label for="age">Возраст:</label>
            <input type="number" id="age" name="age" required placeholder="Сколько тебе лет">

            <!-- Обязательное поле почты -->
            <label for="email">Электронная почта:</label>
            <input type="email" id="email" name="email" required placeholder="example@mail.com">

            <label for="style">Основной стиль строительства:</label>
            <input type="text" id="style" name="style" required placeholder="Например: Medieval, Modern, Terraforming">

            <label for="portfolio">Ссылки на примеры работ (Imgur, YouTube и др.):</label>
            <textarea id="portfolio" name="portfolio" rows="4" required placeholder="Прикрепи ссылки на скриншоты или видео"></textarea>

            <button type="submit">Отправить заявку</button>
        </form>
    </div>

</body>
</html>
