<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка в команду McGroop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #4CAF50; }
        label { display: block; margin-top: 15px; font-size: 14px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #45a049; }
        #status-message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Заявка в McGroop</h2>
    <form id="mcgroopForm">
        <!-- Обязательное поле Email -->
        <label for="email">Электронная почта (обязательно):</label>
        <input type="email" id="email" name="email" required placeholder="example@mail.com">

        <label for="application">Расскажи о себе и опыте строительства:</label>
        <textarea id="application" name="application" rows="5" required placeholder="Строю крутые современные города и метро..."></textarea>

        <button type="submit" id="submitBtn">Отправить заявку</button>
        <div id="status-message"></div>
    </form>
</div>

<script>
    document.getElementById('mcgroopForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const appText = document.getElementById('application').value;
        const statusDiv = document.getElementById('status-message');
        const submitBtn = document.getElementById('submitBtn');

        statusDiv.style.color = '#ffeb3b';
        statusDiv.textContent = '🤖 ИИ проверяет вашу заявку...';
        submitBtn.disabled = true;

        const prompt = `Ты строгий модератор заявок в элитную Minecraft-команду строителей McGroop. Проанализируй текст игрока на адекватность, отсутствие мата и спама. Отвечай строго в формате JSON без лишнего текста: {"status": "approved" или "rejected", "reason": "краткая причина на русском"}. Текст заявки: "${appText}"`;

        try {
            // Запрос к Pollinations AI
            const response = await fetch('https://gen.pollinations.ai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'openai',
                    messages: [
                        { role: 'system', content: 'Ты бот-модератор. Отвечай только валидным JSON.' },
                        { role: 'user', content: prompt }
                    ],
                    temperature: 0.1
                })
            });

            const data = await response.json();
            const rawContent = data.choices[0].message.content;
            
            // Очищаем ответ от лишних символов (на случай если ИИ добавит разметку кода)
            const cleanJSON = rawContent.replace(/```json/g, '').replace(/```/g, '').trim();
            const moderation = JSON.parse(cleanJSON);

            if (moderation.status === 'approved') {
                statusDiv.style.color = '#4CAF50';
                statusDiv.textContent = '✅ Заявка успешно прошла модерацию ИИ и отправлена!';
                
                // Сюда можно добавить отправку данных дальше (например, через Web3Forms)
                // document.getElementById('mcgroopForm').reset();
            } else {
                statusDiv.style.color = '#f44336';
                statusDiv.textContent = `❌ Заявка отклонена ИИ: ${moderation.reason}`;
                submitBtn.disabled = false;
            }

        } catch (error) {
            console.error('Ошибка:', error);
            statusDiv.style.color = '#4CAF50';
            statusDiv.textContent = '✅ Заявка принята!';
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
