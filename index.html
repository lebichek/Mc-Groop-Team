<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка в McGroop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #4CAF50; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-size: 14px; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            background: #2d2d2d;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #45a049; }
        button:disabled { background: #555; cursor: not-allowed; }
        #response-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h2>Заявка в McGroop</h2>
    <form id="appForm">
        <label for="email">Email (обязательно):</label>
        <input type="email" id="email" name="email" required placeholder="Твоя почта">

        <label for="message">Расскажи о себе:</label>
        <textarea id="message" name="message" rows="5" required placeholder="Опыт, что строишь..."></textarea>

        <button type="submit" id="sendBtn">Отправить заявку</button>
        <div id="response-msg"></div>
    </form>
</div>

<script>
    document.getElementById('appForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const message = document.getElementById('message').value;
        const msgDiv = document.getElementById('response-msg');
        const sendBtn = document.getElementById('sendBtn');

        msgDiv.style.color = '#ffeb3b';
        msgDiv.textContent = '🤖 ИИ оценивает заявку...';
        sendBtn.disabled = true;

        const aiPrompt = `Ты строгий модератор заявок в Minecraft-команду McGroop. Проверь текст игрока на адекватность и спам. Отвечай СТРОГО в формате JSON без кавычек markdown: {"status": "approved" или "rejected", "reason": "причина на русском"}. Текст: "${message}"`;

        try {
            const res = await fetch('https://gen.pollinations.ai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'openai',
                    messages: [
                        { role: 'system', content: 'Отвечай только валидным JSON.' },
                        { role: 'user', content: aiPrompt }
                    ],
                    temperature: 0.1
                })
            });

            const data = await res.json();
            const raw = data.choices[0].message.content;
            const cleanJSON = raw.replace(/```json/g, '').replace(/```/g, '').trim();
            const result = JSON.parse(cleanJSON);

            if (result.status === 'approved') {
                msgDiv.style.color = '#4CAF50';
                msgDiv.textContent = '✅ Заявка одобрена ИИ и отправлена!';
                // Сюда можно добавить отправку дальше, например через Web3Forms
                // document.getElementById('appForm').reset();
            } else {
                msgDiv.style.color = '#f44336';
                msgDiv.textContent = `❌ Отклонено: ${result.reason}`;
                sendBtn.disabled = false;
            }

        } catch (err) {
            console.error(err);
            msgDiv.style.color = '#4CAF50';
            msgDiv.textContent = '✅ Заявка успешно отправлена!';
            sendBtn.disabled = false;
        }
    });
</script>

</body>
</html>
