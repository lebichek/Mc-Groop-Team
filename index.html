<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McGroop Build Team — Подача заявки</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            /* Текстура темного камня/скалы на фоне */
            background-color: #0b0b0b;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.04), transparent 50%),
                repeating-linear-gradient(0deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 3px),
                linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)),
                url('https://images.unsplash.com/photo-1542362567-b07e2af2953c?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f0f3f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(12, 12, 12, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            text-align: center;
        }

        /* Фирменный точечный бейдж в стиле Fiply ID */
        .brand-badge {
            display: inline-block;
            padding: 10px 24px;
            border: 2px dotted rgba(255, 255, 255, 0.35);
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #fff;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.02);
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #8c8c8c;
            margin-bottom: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 14px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: #8c8c8c;
            padding-left: 4px;
        }

        input, textarea, select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.25s ease;
        }

        input::placeholder, textarea::placeholder {
            color: #5a5a5a;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #ffffff;
            background: rgba(30, 30, 30, 0.8);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Главная белая кнопка как на референсе */
        .btn-submit {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: #ffffff;
            border: none;
            color: #000000;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.2);
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background: #e6e6e6;
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: scale(0.97);
            background: #cccccc;
        }

        .btn-submit:disabled {
            background: #333333;
            color: #777777;
            cursor: not-allowed;
            box-shadow: none;
        }

        #status-msg {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Блок в стиле Fiply ID с точечной границей -->
        <div class="brand-badge">McGroop</div>
        
        <div class="title">Заявка в команду</div>
        <div class="subtitle">Заполни форму для вступления</div>

        <form id="mcgroopForm">
            <input type="hidden" name="access_key" value="c3850476-3e1b-4a1a-912d-694d5a4662d5">
            <input type="hidden" name="subject" value="Новая заявка в McGroop!">

            <div class="form-group">
                <label for="email">Электронная почта</label>
                <input type="email" id="email" name="Email" required placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label for="nickname">Никнейм в игре</label>
                <input type="text" id="nickname" name="Nickname" required placeholder="Steve_Pro">
            </div>

            <div class="form-group">
                <label for="age">Возраст</label>
                <input type="number" id="age" name="Age" required placeholder="15">
            </div>

            <div class="form-group">
                <label for="contact">Связь (Telegram / Discord)</label>
                <input type="text" id="contact" name="Contact" required placeholder="@username">
            </div>

            <div class="form-group">
                <label for="style">Стиль строительства</label>
                <select id="style" name="Style">
                    <option value="Город / Метро / Инфраструктура">Город / Метро / Инфраструктура</option>
                    <option value="Средневековье / Фэнтези">Средневековье / Фэнтези</option>
                    <option value="Терраформинг / Ландшафт">Терраформинг / Ландшафт</option>
                    <option value="Модерн / Хай-тек">Модерн / Хай-тек</option>
                    <option value="Интерьеры">Интерьеры / Декорации</option>
                </select>
            </div>

            <div class="form-group">
                <label for="portfolio">Портфолио (если есть)</label>
                <textarea id="portfolio" name="Portfolio" placeholder="Ссылки на Imgur, Яндекс Диск... (можно пусто)"></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">далее</button>
            <div id="status-msg"></div>
        </form>
    </div>

<script>
    document.getElementById('mcgroopForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const form = this;
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('status-msg');
        
        const nickname = document.getElementById('nickname').value.trim();
        const age = document.getElementById('age').value.trim();
        const contact = document.getElementById('contact').value.trim();
        let portfolio = document.getElementById('portfolio').value.trim();

        // Автозамена для пустых ответов и фразы "нету"
        if (!portfolio || portfolio.toLowerCase() === 'нету' || portfolio.toLowerCase() === 'нет') {
            portfolio = 'Скриншоты не приложены (нет портфолио)';
            document.getElementById('portfolio').value = portfolio;
        }

        // Защита от огромного спама
        if (nickname.length > 25 || contact.length > 35 || portfolio.length > 1000) {
            statusMsg.style.color = '#ff6b6b';
            statusMsg.textContent = '❌ Ошибка: Слишком много символов в полях.';
            return;
        }

        const spamPattern = /(.)\1{4,}/;
        if (spamPattern.test(nickname) || spamPattern.test(contact)) {
            statusMsg.style.color = '#ff6b6b';
            statusMsg.textContent = '❌ Заявка отклонена: обнаружен спам.';
            return;
        }

        statusMsg.style.color = '#cccccc';
        statusMsg.textContent = '🤖 Проверка заявки...';
        submitBtn.disabled = true;

        const aiPrompt = `Ты суровый модератор. Отклоняй (rejected) только если это явный бред или спам (рандомные буквы типа "аывавы"). Если человек просто написал, что нет портфолио или указал обычные данные — одобряй (approved).
Отвечай СТРОГО в формате JSON без markdown: {"status": "approved" или "rejected", "reason": "причина на русском"}.
Данные: Ник: "${nickname}", Возраст: "${age}", Контакт: "${contact}", Портфолио: "${portfolio}"`;

        try {
            const res = await fetch('https://gen.pollinations.ai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'openai',
                    messages: [
                        { role: 'system', content: 'Отвечай только валидным JSON.' },
                        { role: 'user', content: aiPrompt }
                    ],
                    temperature: 0.1
                })
            });

            const data = await res.json();
            const raw = data.choices[0].message.content;
            const cleanJSON = raw.replace(/```json/g, '').replace(/```/g, '').trim();
            const result = JSON.parse(cleanJSON);

            if (result.status === 'rejected') {
                statusMsg.style.color = '#ff6b6b';
                statusMsg.textContent = `❌ Отклонено ИИ: ${result.reason}`;
                submitBtn.disabled = false;
                return;
            }

        } catch (err) {
            console.error('Ошибка ИИ:', err);
        }

        statusMsg.style.color = '#cccccc';
        statusMsg.textContent = '🚀 Отправка заявки...';

        try {
            const formData = new FormData(form);
            const sendResponse = await fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            });

            const data = await sendResponse.json();

            if (data.success) {
                statusMsg.style.color = '#ffffff';
                statusMsg.textContent = '✓ Заявка успешно отправлена!';
                form.reset();
            } else {
                statusMsg.style.color = '#ff6b6b';
                statusMsg.textContent = '❌ Ошибка отправки на почту.';
            }
        } catch (err) {
            statusMsg.style.color = '#ff6b6b';
            statusMsg.textContent = '❌ Ошибка сети.';
        }

        submitBtn.disabled = false;
    });
</script>

</body>
</html>
